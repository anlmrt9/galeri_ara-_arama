<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <title>Hasar toleransı</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2933; --muted: #6b7280; --line: #d6dbe1;
      --orig: #e8edf2; --orig-fg: #6b7280;
      --paint: #2563eb; --change: #dc2626; --focus: #f59e0b;
    }
    :root[data-theme="dark"] {
      --bg: #0e1117; --fg: #e5e7eb; --muted: #9ca3af; --line: #2d333b;
      --orig: #1f2630; --orig-fg: #9ca3af;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 4px 0; background: transparent; color: var(--fg);
           font: 14px/1.4 "Source Sans Pro", -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
    .car { display: grid; grid-template-columns: 44px 96px 44px;
           grid-template-rows: 26px 60px 48px 48px 60px 26px; gap: 4px; flex: none; }
    button.part { border: 1px solid var(--line); border-radius: 6px; background: var(--orig);
                  color: var(--orig-fg); font: 600 11px/1 inherit; cursor: pointer; padding: 0;
                  transition: background .15s, color .15s; }
    button.part:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
    button.part[data-state="boyali"] { background: var(--paint); border-color: var(--paint); color: #fff; }
    button.part[data-state="degisen"] { background: var(--change); border-color: var(--change); color: #fff; }
    #on_tampon { grid-column: 1 / 4; grid-row: 1; border-radius: 14px 14px 6px 6px; }
    #sol_on_cam { grid-column: 1; grid-row: 2; } #kaput { grid-column: 2; grid-row: 2; }
    #sag_on_cam { grid-column: 3; grid-row: 2; }
    #sol_on_kapi { grid-column: 1; grid-row: 3; } #tavan { grid-column: 2; grid-row: 3 / 5; }
    #sag_on_kapi { grid-column: 3; grid-row: 3; }
    #sol_arka_kapi { grid-column: 1; grid-row: 4; } #sag_arka_kapi { grid-column: 3; grid-row: 4; }
    #sol_arka_cam { grid-column: 1; grid-row: 5; } #bagaj { grid-column: 2; grid-row: 5; }
    #sag_arka_cam { grid-column: 3; grid-row: 5; }
    #arka_tampon { grid-column: 1 / 4; grid-row: 6; border-radius: 6px 6px 14px 14px; }
    .side { min-width: 200px; flex: 1; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 10px; padding: 0; list-style: none; }
    .legend li { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
    .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); }
    .sw.o { background: var(--orig); } .sw.b { background: var(--paint); } .sw.d { background: var(--change); }
    .summary { font-size: 13px; color: var(--muted); margin: 6px 0; }
    .summary b { color: var(--fg); font-weight: 600; }
    .reset { margin-top: 6px; background: none; border: 1px solid var(--line); color: var(--fg);
             border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
    .reset:focus-visible { outline: 3px solid var(--focus); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="car" role="group" aria-label="Araç parçaları — durum değiştirmek için tıklayın">
      <button class="part" id="on_tampon" data-label="Ön Tampon">Ön Tampon</button>
      <button class="part" id="sol_on_cam" data-label="Sol Ön Çamurluk">Ç</button>
      <button class="part" id="kaput" data-label="Kaput">Kaput</button>
      <button class="part" id="sag_on_cam" data-label="Sağ Ön Çamurluk">Ç</button>
      <button class="part" id="sol_on_kapi" data-label="Sol Ön Kapı">K</button>
      <button class="part" id="tavan" data-label="Tavan">Tavan</button>
      <button class="part" id="sag_on_kapi" data-label="Sağ Ön Kapı">K</button>
      <button class="part" id="sol_arka_kapi" data-label="Sol Arka Kapı">K</button>
      <button class="part" id="sag_arka_kapi" data-label="Sağ Arka Kapı">K</button>
      <button class="part" id="sol_arka_cam" data-label="Sol Arka Çamurluk">Ç</button>
      <button class="part" id="bagaj" data-label="Bagaj">Bagaj</button>
      <button class="part" id="sag_arka_cam" data-label="Sağ Arka Çamurluk">Ç</button>
      <button class="part" id="arka_tampon" data-label="Arka Tampon">Arka Tampon</button>
    </div>
    <div class="side">
      <ul class="legend" aria-hidden="true">
        <li><span class="sw o"></span>Orijinal olmalı</li>
        <li><span class="sw b"></span>Boya kabul</li>
        <li><span class="sw d"></span>Değişen kabul</li>
      </ul>
      <p class="summary" id="sum-b"></p>
      <p class="summary" id="sum-d"></p>
      <button type="button" class="reset" id="reset">Tümünü orijinale sıfırla</button>
      <p class="hint">Parçaya tıklayın (veya Tab + Enter): Orijinal → Boya kabul → Değişen kabul.</p>
      <p class="sr-only" id="live" aria-live="polite" style="position:absolute;left:-9999px"></p>
    </div>
  </div>

  <script>
    // Streamlit bileşen protokolü (streamlit-component-lib'in yaptığının aynısı).
    // Mesaj hedefi "*" protokolün kendisidir; yalnızca hasar seçimi gönderilir.
    const NEXT = { orijinal: "boyali", boyali: "degisen", degisen: "orijinal" };
    const NAMES = { orijinal: "orijinal olmalı", boyali: "boya kabul", degisen: "değişen kabul" };
    const parts = Array.from(document.querySelectorAll("button.part"));
    const state = Object.fromEntries(parts.map(p => [p.id, "orijinal"]));

    function post(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
    }
    function setHeight() { post("streamlit:setFrameHeight", { height: document.body.scrollHeight + 8 }); }
    function emit() { post("streamlit:setComponentValue", { value: Object.assign({}, state), dataType: "json" }); }

    function paint() {
      const b = [], d = [];
      parts.forEach(p => {
        const s = state[p.id];
        p.dataset.state = s;
        p.setAttribute("aria-label", `${p.dataset.label}: ${NAMES[s]}`);
        p.title = `${p.dataset.label}: ${NAMES[s]}`;
        if (s === "boyali") b.push(p.dataset.label);
        if (s === "degisen") d.push(p.dataset.label);
      });
      document.getElementById("sum-b").innerHTML = "<b>Boya kabul:</b> " + (b.join(", ") || "—");
      document.getElementById("sum-d").innerHTML = "<b>Değişen kabul:</b> " + (d.join(", ") || "—");
    }

    parts.forEach(p => p.addEventListener("click", () => {
      state[p.id] = NEXT[state[p.id]];
      paint(); emit();
      document.getElementById("live").textContent = `${p.dataset.label}: ${NAMES[state[p.id]]}`;
    }));
    document.getElementById("reset").addEventListener("click", () => {
      Object.keys(state).forEach(k => state[k] = "orijinal");
      paint(); emit();
    });

    let restored = false;
    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const args = event.data.args || {};
      const theme = event.data.theme;
      if (theme && theme.base) document.documentElement.dataset.theme = theme.base;
      if (!restored && args.initial && typeof args.initial === "object") {
        Object.entries(args.initial).forEach(([k, v]) => { if (k in state && v in NEXT) state[k] = v; });
        restored = true;
        paint();
      }
      setHeight();
    });

    paint();
    post("streamlit:componentReady", { apiVersion: 1 });
    setHeight();
  </script>
</body>
</html>
