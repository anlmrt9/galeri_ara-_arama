# Alembic yapılandırması. Uygulama açılışta migration'ları kendisi çalıştırır
# (otogaleri.db.init_db); elle çalıştırmak için:
#   alembic upgrade head
# Veritabanı URL'si .env / ortam değişkenlerinden okunur (otogaleri.config).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
