[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otogaleri-avci-botu"
version = "1.0.0"
description = "Kriterlere uyan ikinci el araç ilanlarını çoklu galeri/pazaryeri sitesinden tarayan sourcing botu (Streamlit + FastAPI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anıl Mert" }]
keywords = ["scraping", "streamlit", "fastapi", "cars", "sourcing"]

dependencies = [
    "streamlit>=1.35,<2",
    "streamlit-autorefresh>=1.0,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "sqlalchemy>=2.0,<3",
    "pandas>=2.0,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=4.9",
    "curl_cffi>=0.7",
    "seleniumbase>=4.29",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "pyodbc>=5.0 ; sys_platform == 'win32'",
    "win11toast>=0.35 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/anlmrt9/galeri_ara-_arama"

[tool.setuptools]
py-modules = ["config", "db", "scrapers", "notifications", "logger_setup", "scan_service", "api", "app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # satır uzunluğu — black/format hallediyor
    "B008",    # FastAPI Depends(...) default arg deseni
    "SIM102",  # iç içe if — bazı scraper filtrelerinde okunurluğu artırıyor
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
# Kademeli tipleme: mevcut modüller strict değil, yeni modüller sıkı.
[[tool.mypy.overrides]]
module = ["scan_service", "config"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
