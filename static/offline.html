<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çevrimdışı - OtoGaleri Avcı Botu</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0f1225; color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap {
    text-align: center; padding: 32px;
    max-width: 360px;
  }
  .icon {
    width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 20px auto; display: block;
  }
  h1 { font-size: 18px; margin: 0 0 10px 0; }
  p { font-size: 14px; color: #8a8fb8; line-height: 1.5; margin: 0 0 24px 0; }
  button {
    border: none; border-radius: 50px; padding: 12px 28px; font-size: 14px; font-weight: 600;
    background: linear-gradient(135deg, #6a3df5 0%, #b84ffb 100%); color: #ffffff; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="icon" src="/app/static/icon-192.png" alt="OtoGaleri">
    <h1>İnternet bağlantısı yok</h1>
    <p>OtoGaleri Avcı Botu şu anda çevrimdışı. Bağlantınız geri geldiğinde otomatik olarak devam edecek.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
